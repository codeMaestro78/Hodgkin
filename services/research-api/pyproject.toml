[project]
name = "research-api"
version = "0.1.0"
description = "Tenant-safe evidence ingestion and research orchestration service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.20.0",
  "boto3==1.43.103",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "langgraph>=1.2.12",
  "langgraph-checkpoint-postgres==3.1.3",
  "langsmith==0.14.1",
  "openai>=3.20.0",
  "psycopg[binary,pool]==3.3.6",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "pypdf>=6,<7",
  "redis==8.1.0",
  "sqlalchemy[asyncio]==2.1.1",
  "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
  "datamodel-code-generator==0.83.0",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_api"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires local infrastructure",
  "live_provider: makes a gated request to a live provider",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["src/research_api/schemas/generated/"]

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*"]
ignore_missing_imports = true

[tool.uv]
package = true
